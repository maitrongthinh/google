<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Mật mã</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="lockscreen">
    <div class="top">
      <div class="lock-icon">
        <svg width="16" height="22" viewBox="0 0 16 22" fill="none">
          <rect x="1" y="10" width="14" height="11" rx="2.5" stroke="#000" stroke-width="1.2"/>
          <path d="M4.5 10V7C4.5 4.5 6.3 2.5 8 2.5C9.7 2.5 11.5 4.5 11.5 7V10" stroke="#000" stroke-width="1.2" fill="none"/>
        </svg>
      </div>
      <div class="title">Nhập mật mã</div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="keypad">
      <button class="key" data-key="1">
        <span class="num">1</span>
      </button>
      <button class="key" data-key="2">
        <span class="num">2</span>
        <span class="sub">ABC</span>
      </button>
      <button class="key" data-key="3">
        <span class="num">3</span>
        <span class="sub">DEF</span>
      </button>
      <button class="key" data-key="4">
        <span class="num">4</span>
        <span class="sub">GHI</span>
      </button>
      <button class="key" data-key="5">
        <span class="num">5</span>
        <span class="sub">JKL</span>
      </button>
      <button class="key" data-key="6">
        <span class="num">6</span>
        <span class="sub">MNO</span>
      </button>
      <button class="key" data-key="7">
        <span class="num">7</span>
        <span class="sub">PQRS</span>
      </button>
      <button class="key" data-key="8">
        <span class="num">8</span>
        <span class="sub">TUV</span>
      </button>
      <button class="key" data-key="9">
        <span class="num">9</span>
        <span class="sub">WXYZ</span>
      </button>
      <button class="key empty" disabled></button>
      <button class="key" data-key="0">
        <span class="num">0</span>
      </button>
      <button class="key delete" id="deleteKey">
        <svg width="24" height="18" viewBox="0 0 24 18" fill="none">
          <path d="M8.5 1L1 9L8.5 17H23V1H8.5Z" stroke="#000" stroke-width="1.2" fill="none"/>
          <path d="M12 6L18 12M18 6L12 12" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
